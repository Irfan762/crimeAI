version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ksp_admin
      POSTGRES_PASSWORD: ksp_password
      POSTGRES_DB: ksp_crime_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/ksp_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
